<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-S3 混合信号分析与寻迹测试终端 · 系统拓扑原理图</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 5px; text-align: center; }
    p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; text-align: center; }
    .container {
      width: 100%;
      max-width: 1200px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow-x: auto;
    }
    svg {
      display: block;
      width: 100%;
      height: 750px;
      background-color: #0f172a;
      border-radius: 8px;
    }
    .box { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 6px; }
    .mcu-box { fill: #0f2847; stroke: #38bdf8; stroke-width: 2.5; rx: 6px; }
    .module-box { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 6px; }
    .text-title { font-size: 13px; font-weight: bold; fill: #f8fafc; font-family: sans-serif; }
    .text-sub { font-size: 11px; fill: #cbd5e1; font-family: monospace; }
    .text-pin { font-size: 10px; fill: #94a3b8; font-family: monospace; }
    .wire { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-linecap: round; }
    .wire-5v { stroke: #ef4444; stroke-width: 2; fill: none; }
    .wire-3v3 { stroke: #22c55e; stroke-width: 2; fill: none; }
    .wire-gnd { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
    .wire-bias { stroke: #eab308; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
    .legend { display: flex; gap: 20px; margin-top: 15px; font-size: 12px; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .line-sample { width: 25px; height: 3px; display: inline-block; }
  </style>
</head>
<body>

<h1>ESP32-S3 混合信号分析与寻迹测试终端</h1>
<p class="subtitle">双电源总线 · 精密 VBIAS 虚地 · 模块化架构系统拓扑图</p>

<div class="container">
  <svg viewBox="0 0 1150 720" xmlns="http://www.w3.org/2000/svg">

    <!-- ================= 1. 电源与偏置发生器 ================= -->
    <rect x="30" y="30" width="220" height="150" class="box" />
    <text x="45" y="55" class="text-title" fill="#eab308">1. 精密 VBIAS 发生器</text>
    <text x="45" y="75" class="text-pin">3.3V ── [R:10k] ──┬── VBIAS (1.65V)</text>
    <text x="45" y="95" class="text-pin">               ├── [R:10k] ── GND</text>
    <text x="45" y="115" class="text-pin">               ├── [C:10uF] ── GND</text>
    <text x="45" y="135" class="text-pin">               └── [C:100nF] ─ GND</text>

    <!-- ================= 2. 模拟采集前端 ================= -->
    <rect x="280" y="30" width="300" height="220" class="box" />
    <text x="295" y="55" class="text-title" fill="#38bdf8">2. 模拟采集前端 (ADC Chain)</text>
    <text x="295" y="80" class="text-pin">TP_IN ── [Cin:10uF] ──┬── R1(10k) ── 4053_Y0</text>
    <text x="295" y="105" class="text-pin">                     └── R2(90k) ──┬── R3(10k) ── GND</text>
    <text x="295" y="130" class="text-pin">                                   └── 4053_Y1</text>
    <text x="295" y="160" class="text-pin">4053_COM_Y ──┬── [R:100k] ── VBIAS</text>
    <text x="295" y="185" class="text-pin">             ├── [BAT54S] ── 3.3V / GND</text>
    <text x="295" y="210" class="text-pin">             ├── [C:100pF] ── GND</text>
    <text x="295" y="235" class="text-pin">             └── TO_MCU_ADC (GP1)</text>

    <!-- ================= 3. 模拟开关 74HC4053 ================= -->
    <rect x="620" y="30" width="180" height="220" class="box" />
    <text x="635" y="55" class="text-title" fill="#a855f7">3. 模拟开关芯片</text>
    <text x="650" y="90" class="text-sub">74HC4053 / 4053</text>
    <text x="635" y="130" class="text-pin">Y0, Y1 ◄── 采集通道</text>
    <text x="635" y="155" class="text-pin">X0, X1 ◄── 发生通道</text>
    <text x="635" y="180" class="text-pin">S_A ◄── RANGE_SEL (GP2)</text>
    <text x="635" y="205" class="text-pin">S_B ◄── LEVEL_SEL (GP12)</text>
    <text x="635" y="230" class="text-pin">VCC=3.3V, VEE/GND=0V</text>

    <!-- ================= 4. 音频DAC发生与输出前端 ================= -->
    <rect x="30" y="280" width="380" height="240" class="box" />
    <text x="45" y="305" class="text-title" fill="#ec4899">4. 发生/寻迹探针输出前端</text>
    <text x="45" y="330" class="text-pin">PCM_R_OUT ── [C1:10uF] ──┬── [R:100k] ── VBIAS</text>
    <text x="45" y="355" class="text-pin">                         ├── R4(1k) ── 4053_X0</text>
    <text x="45" y="380" class="text-pin">                         └── R5(100k) ──┬── R6(1k) ── VBIAS</text>
    <text x="45" y="405" class="text-pin">                                        └── 4053_X1</text>
    <text x="45" y="445" class="text-pin">4053_COM_X ── [C2:10uF] ──┬── [R:100k] ── GND</text>
    <text x="45" y="475" class="text-pin">                         └── PROBE_OUT (TestPoint)</text>

    <!-- ================= 5. 甲类寻迹预听功放 ================= -->
    <rect x="440" y="280" width="360" height="240" class="box" />
    <text x="455" y="305" class="text-title" fill="#f97316">5. 甲类寻迹预听功放 (S8050)</text>
    <text x="455" y="335" class="text-pin">PCM_L_OUT ── [Cin:10uF] ── S8050 Base (Q1)</text>
    <text x="455" y="365" class="text-pin">Base ──┬── [R:22k] ── +5V</text>
    <text x="455" y="390" class="text-pin">       └── [R:4.7k] ── GND</text>
    <text x="455" y="425" class="text-pin">S8050 Emitter ── [Re:15Ω] ── GND</text>
    <text x="455" y="455" class="text-pin">S8050 Collector ── Speaker(-) [SPK1]</text>
    <text x="455" y="485" class="text-pin">Speaker(+) ── +5V 主电源</text>

    <!-- ================= 6. 主控与外设模块 ================= -->
    <rect x="830" y="30" width="290" height="490" class="module-box" />
    <text x="850" y="60" class="text-title" fill="#c084fc">6. 核心开发板与外设模块群</text>

    <text x="850" y="95" class="text-sub" fill="#38bdf8">【MCU1: ESP32-S3-SuperMini】[cite: 2]</text>
    <text x="850" y="120" class="text-pin">GP1 ◄── TO_MCU_ADC</text>
    <text x="850" y="145" class="text-pin">GP2 / GP12 ──► 量程/电平控制</text>
    <text x="850" y="170" class="text-pin">GP4~6 (I2S) ──► PCM5102A</text>
    <text x="850" y="195" class="text-pin">GP7~9 (SPI) ──► ST7789 屏幕</text>
    <text x="850" y="220" class="text-pin">GP10~13 ──► EC11 编码器</text>

    <text x="850" y="270" class="text-sub" fill="#a855f7">【PCM1: PCM5102A L型音频 DAC】[cite: 3]</text>
    <text x="850" y="295" class="text-pin">VIN (+5V), A3V3 (+3.3V), GND</text>
    <text x="850" y="320" class="text-pin">BCK, LCK, DIN ◄── MCU I2S</text>
    <text x="850" y="345" class="text-pin">LROUT (左) ──► 功放 | ROUT (右) ──► 4053</text>

    <text x="850" y="395" class="text-sub" fill="#a855f7">【DISP1: 2.4寸 TFT + EC11】[cite: 1]</text>
    <text x="850" y="420" class="text-pin">VCC (+5V), BLK (+5V), GND</text>
    <text x="850" y="445" class="text-pin">SCL, SDA, RES, DC ──► MCU SPI</text>
    <text x="850" y="470" class="text-pin">A, B, PUSH (编码器信号) ──► MCU</text>

    <!-- ================= 底部总线指引 ================= -->
    <rect x="30" y="550" width="1090" height="140" class="box" fill="#0f172a" />
    <text x="50" y="580" class="text-title" fill="#22c55e">双电源总线（Power Bus）与系统共地拓扑说明：</text>
    <text x="50" y="610" class="text-pin">🔴 +5V 主电源总线：连接 USB 5V 输入，直供 PCM5102A 模块[cite: 3]、ST7789 背光[cite: 1]、S8050 喇叭及外设大功率器件。</text>
    <text x="50" y="635" class="text-pin">🟢 +3.3V 精密总线：由 ESP32 板载 LDO 输出，专供 74HC4053 模拟开关、VBIAS 分压基准及逻辑芯片。</text>
    <text x="50" y="660" class="text-pin">🔵 GND 系统共地：所有模块的模拟地、数字地、电源地在主板单点汇聚，确保高频与音频信号回流纯净。</text>

  </svg>
</div>

<div class="legend">
  <div class="legend-item"><span class="line-sample" style="background:#ef4444"></span> +5V 总线</div>
  <div class="legend-item"><span class="line-sample" style="background:#22c55e"></span> +3.3V 总线</div>
  <div class="legend-item"><span class="line-sample" style="background:#38bdf8"></span> 系统共地 (GND)</div>
  <div class="legend-item"><span class="line-sample" style="background:#eab308"></span> VBIAS (1.65V)</div>
</div>

</body>
</html>
